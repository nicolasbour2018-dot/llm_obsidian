[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-rag"
version = "0.1.0"
description = "RAG local en lecture seule pour un coffre Obsidian, avec Mistral Large"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Nicolas Bour" }]
dependencies = [
  "mistralai~=2.9.2",
  "numpy~=2.5.1",
  "python-dotenv~=1.2.2",
  "PyYAML~=6.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[project.scripts]
obsidian-rag = "obsidian_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["live: test utilisant réellement l'API Mistral (désactivé par défaut)"]
